<title>Whyyoucomingfast Login</title><link rel="stylesheet" href="style.css?v=2"></head><body><main>
<h1>Whyyoucomingfast</h1><p id="m">Login complete. Sending the code to the Whyyoucomingfast tool on this computer...</p>
